\ProvidesFile{biblatex.cfg}

% From Santi: to order by year and month first.
% See https://tex.stackexchange.com/a/140641/56795 and https://tex.stackexchange.com/a/46879/56795
\DeclareSortingTemplate{ymddnt}{
  \sort{
    \field{presort}
  }
  \sort[final]{
    \field{sortkey}
  }
  \sort[direction=descending]{
    \field[strside=left,strwidth=4]{sortyear}
    \field[strside=left,strwidth=4]{year}
    \literal{9999}
  }
  \sort[direction=descending]{
    \field{month}
    \literal{99}
  }
  \sort[direction=descending]{
    \field{day}
    \literal{99}
  }
  \sort{
    \field{sortname}
    \field{author}
    \field{editor}
    \field{translator}
    \field{sorttitle}
    \field{title}
  }
  \sort{
    \field{sorttitle}
    \field{title}
  }
}

\renewcommand{\bibsetup}{\vspace*{-\baselineskip}\color{inner-body}}
\setlength{\bibitemsep}{0.12\baselineskip}
\setlength{\bibhang}{0pt}

% Preserve full link targets before MLA's sourcemaps strip URL schemes.
\DeclareSourcemap{
  \maps[datatype=bibtex]{
    \map{
      \step[fieldsource=url, final]
      \step[fieldset=verba, origfieldval]
    }
  }
}

% Link publication titles without changing their italics or body color.
\newbibmacro*{linkedtitle}[1]{%
  \iffieldundef{verba}
    {\textcolor{body}{\mkbibemph{#1}}}
    {\href{\thefield{verba}}{\textcolor{body}{\mkbibemph{#1}}}}}

\DeclareFieldFormat{title:inproceedings}{\usebibmacro{linkedtitle}{#1}}
\DeclareFieldFormat{title:article}{\usebibmacro{linkedtitle}{#1}}
\DeclareFieldFormat{title:incollection}{\usebibmacro{linkedtitle}{#1}}
\DeclareFieldFormat{title:misc}{\usebibmacro{linkedtitle}{#1}}
\DeclareFieldFormat{title}{\usebibmacro{linkedtitle}{#1}}

\endinput
