\ProvidesFile{biblatex.cfg}

% From Santi: to order by year and month first.
% See https://tex.stackexchange.com/a/140641/56795 and https://tex.stackexchange.com/a/46879/56795
\DeclareSortingTemplate{ymddnt}{
  \sort{
    \field{presort}
  }
  \sort[final]{
    \field{sortkey}
  }
  \sort[direction=descending]{
    \field[strside=left,strwidth=4]{sortyear}
    \field[strside=left,strwidth=4]{year}
    \literal{9999}
  }
  \sort[direction=descending]{
    \field{month}
    \literal{99}
  }
  \sort[direction=descending]{
    \field{day}
    \literal{99}
  }
  \sort{
    \field{sortname}
    \field{author}
    \field{editor}
    \field{translator}
    \field{sorttitle}
    \field{title}
  }
  \sort{
    \field{sorttitle}
    \field{title}
  }
}

\renewcommand{\bibsetup}{\vspace*{-\baselineskip}\color{inner-body}}
\setlength{\bibitemsep}{0.12\baselineskip}
\setlength{\bibhang}{0pt}

% Publication titles in italics and body color
\DeclareFieldFormat{title:inproceedings}{\textcolor{body}{\mkbibemph{#1}}}
\DeclareFieldFormat{title:article}{\textcolor{body}{\mkbibemph{#1}}}
\DeclareFieldFormat{title:incollection}{\textcolor{body}{\mkbibemph{#1}}}
\DeclareFieldFormat{title:misc}{\textcolor{body}{\mkbibemph{#1}}}
\DeclareFieldFormat{title}{\textcolor{body}{\mkbibemph{#1}}}

\endinput
